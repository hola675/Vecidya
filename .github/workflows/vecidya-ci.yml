name: Vecidya CI

on:
  pull_request:
    branches: [main]
    paths:
      - "vecidya-platform/**"
      - ".devcontainer/**"
      - ".github/workflows/vecidya-ci.yml"
  push:
    branches: [main, integration/phase-00-main-reconcile]
    paths:
      - "vecidya-platform/**"
      - ".devcontainer/**"
      - ".github/workflows/vecidya-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vecidya-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Unit tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
        working-directory: vecidya-platform
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: vecidya-platform/pnpm-lock.yaml
      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "11.21.0"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:unit
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
