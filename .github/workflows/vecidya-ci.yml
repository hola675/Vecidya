name: Vecidya CI

on:
  pull_request:
    branches: [main]
    paths:
      - "vecidya-platform/**"
      - ".devcontainer/**"
      - ".github/workflows/vecidya-ci.yml"
  push:
    branches: [main]
    paths:
      - "vecidya-platform/**"
      - ".devcontainer/**"
      - ".github/workflows/vecidya-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vecidya-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Unit tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vecidya-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: vecidya-platform/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:unit
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
