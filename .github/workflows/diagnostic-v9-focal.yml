name: Diagnostic V9 focused verification
on:
  workflow_dispatch:
  push:
    branches:
      - feat/diagnostic-v9-lex-graph-p1b
    paths:
      - .github/workflows/diagnostic-v9-focal.yml
permissions:
  contents: read
jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vecidya-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Locate focused existing tests
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -type f \( -name '*qa03b*.test.ts' -o -name '*diagnostic-v9*.test.ts' -o -name '*qbv2-rules*.test.ts' \) | sort)
          printf 'Found %s focused tests\n' "${#tests[@]}"
          printf '%s\n' "${tests[@]}"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo 'No existing focused test files found; refusing to substitute broad suite.' >&2
            exit 1
          fi
          printf '%s\n' "${tests[@]}" > /tmp/v9-focused-tests.txt
      - name: Run only focused tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < /tmp/v9-focused-tests.txt
          node --experimental-strip-types --import ./tests/unit/register-ts.mjs --test "${tests[@]}"
