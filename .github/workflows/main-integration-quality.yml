name: Main integration quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep the original broad regression for main and unrelated pull requests.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feat/diagnostic-v9-') }}
    name: Typecheck, build and unit regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: vecidya-platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: vecidya-platform/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Diagnostic and Aprende regression
        run: node --experimental-strip-types --import ./tests/unit/register-ts.mjs --test tests/unit/diagnostic/diagnostic-flow-ui.test.ts tests/unit/learn/learn-curriculum.test.ts
      - name: Unit regression
        run: pnpm test:unit

  diagnostic-v9-focused:
    # PR V9: ejecutar solo contratos focales afectados por W1/F00.
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/diagnostic-v9-') }}
    name: Diagnostic V9 W1/F00 focused contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: vecidya-platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: vecidya-platform/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: W1 migration and sector integration contracts
        run: >-
          node --experimental-strip-types --import ./tests/unit/register-ts.mjs --test
          tests/unit/business-sector-picker.test.ts
          tests/unit/business-sectors.test.ts
          tests/unit/diagnostic/qa03b-v9-audit-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-audit-recovery-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-identity-ownership-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-identity-claim-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-organization-link-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-owned-run-create-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-event-ingestion-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-run-state-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-result-finalization-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-identity-assignment-sqlite.test.ts
          tests/unit/diagnostic/qa03b-worker-replay-v9.test.ts
