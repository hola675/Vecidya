name: Main integration quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep the original broad regression for main and unrelated pull requests.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feat/diagnostic-v9-') }}
    name: Typecheck, build and unit regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: vecidya-platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: vecidya-platform/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Diagnostic and Aprende regression
        run: node --experimental-strip-types --import ./tests/unit/register-ts.mjs --test tests/unit/diagnostic/diagnostic-flow-ui.test.ts tests/unit/learn/learn-curriculum.test.ts
      - name: Unit regression
        run: pnpm test:unit

  diagnostic-v9-focused:
    # Candidate V9 PRs: question/answer matrix, graph, sector journeys and candidate contracts.
    # No full build, Aprende tests, or unrelated unit suites.
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/diagnostic-v9-') }}
    name: Diagnostic V9 focused contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: vecidya-platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: vecidya-platform/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck V9 candidate and tests
        run: pnpm typecheck
      - name: V9 question bank, graph and adaptive journey contracts
        run: >-
          node --experimental-strip-types --import ./tests/unit/register-ts.mjs --test
          tests/unit/diagnostic/qa03b-v9-classification-bundle.test.ts
          tests/unit/diagnostic/qa03b-v9-editorial-review-matrix.test.ts
          tests/unit/diagnostic/qa03b-v9-editorial-graph-audit.test.ts
          tests/unit/diagnostic/qa03b-specialty-candidate.test.ts
          tests/unit/diagnostic/qa03b-specialty-branches-wave1.test.ts
          tests/unit/diagnostic/qa03b-specialty-journey-certification.test.ts
          tests/unit/diagnostic/qa03b-v9-menu-v2-proposal.test.ts
          tests/unit/diagnostic/qa03b-v9-audit-repository.test.ts
          tests/unit/diagnostic/qa03b-v9-audit-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-audit-history.test.ts
          tests/unit/diagnostic/qa03b-v9-audit-recovery-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-snapshot-hash.test.ts
          tests/unit/diagnostic/qa03b-v9-classification-audit-replay.test.ts
          tests/unit/diagnostic/qa03b-v9-identity-ownership-sqlite.test.ts
          tests/unit/diagnostic/qa03b-v9-identity-credential.test.ts
