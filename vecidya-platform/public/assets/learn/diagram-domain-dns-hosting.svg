<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" role="img" aria-labelledby="title desc">
  <title id="title">Cómo llega una persona a una página web</title>
  <desc id="desc">La persona usa un navegador. Si no hay una respuesta DNS vigente en caché, el navegador consulta un resolver y recibe la dirección del servidor. Después solicita la página al servidor web.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 10 6 1 11" fill="none" stroke="#155fc5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
    </marker>
    <marker id="arrow-warm" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 10 6 1 11" fill="none" stroke="#c45116" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
    </marker>
  </defs>
  <rect width="960" height="384" rx="28" fill="#f4f8ff" />
  <g fill="#fff" stroke="#155fc5" stroke-width="4">
    <rect x="18" y="190" width="142" height="120" rx="18" />
    <rect x="184" y="190" width="205" height="120" rx="18" />
    <rect x="411" y="190" width="112" height="120" rx="18" stroke="#c45116" />
    <rect x="545" y="190" width="198" height="120" rx="18" />
    <rect x="765" y="190" width="177" height="120" rx="18" />
  </g>
  <g fill="none" stroke="#155fc5" stroke-linecap="round" stroke-width="5" marker-end="url(#arrow)">
    <path d="M162 250h17" />
    <path d="M391 250h17" />
    <path d="M745 250h17" />
  </g>
  <path d="M286 314v34h358v-30" fill="none" stroke="#155fc5" stroke-linecap="round" stroke-width="5" marker-end="url(#arrow)" />
  <path d="M467 184v-74h-168v74" fill="none" stroke="#c45116" stroke-dasharray="10 9" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow-warm)" />
  <g fill="#18324f" font-family="Arial,sans-serif" font-size="40" font-weight="700" text-anchor="middle">
    <text x="89" y="264">Persona</text>
    <text x="286" y="264" textLength="184" lengthAdjust="spacingAndGlyphs">Navegador</text>
    <text x="467" y="264">DNS</text>
    <text x="644" y="245"><tspan x="644">Servidor</tspan><tspan x="644" dy="46">web</tspan></text>
    <text x="853" y="245"><tspan x="853">Página</tspan><tspan x="853" dy="46" font-size="36" textLength="158" lengthAdjust="spacingAndGlyphs">solicitada</tspan></text>
  </g>
</svg>
