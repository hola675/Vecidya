<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Una consulta puede seguir distintos caminos</title>
  <desc id="desc">Registra el contexto y acuerda el siguiente paso. La conversación puede continuar, retomarse después en una fecha acordada o cerrarse; no toda consulta se convierte en cliente.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#ff6b0b" />
    </marker>
  </defs>
  <rect width="900" height="360" rx="28" fill="#f4f8ff" />
  <g fill="#fff" stroke="#155fc5" stroke-width="3">
    <rect x="24" y="132" width="190" height="96" rx="16" />
    <rect x="264" y="132" width="200" height="96" rx="16" />
    <rect x="514" y="132" width="180" height="96" rx="16" />
    <rect x="724" y="24" width="152" height="78" rx="14" />
    <rect x="724" y="141" width="152" height="78" rx="14" />
    <rect x="724" y="258" width="152" height="78" rx="14" />
  </g>
  <g fill="none" stroke="#ff6b0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M218 180h38" />
    <path d="M468 180h38" />
    <path d="M698 180h14V63h8" />
    <path d="M712 180h8" />
    <path d="M712 180v117h8" />
  </g>
  <g fill="#155fc5" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="119" y="174" font-size="25">Consulta</text><text x="119" y="204" font-size="25">recibida</text>
    <text x="364" y="174" font-size="25">Registrar</text><text x="364" y="204" font-size="25">contexto</text>
    <text x="604" y="174" font-size="25">Elegir próximo</text><text x="604" y="204" font-size="25">paso</text>
    <text x="800" y="71" font-size="24">Continuar</text>
    <text x="800" y="188" font-size="24">Retomar</text>
    <text x="800" y="288" font-size="24">Cerrar</text><text x="800" y="316" font-size="24">registro</text>
  </g>
</svg>
