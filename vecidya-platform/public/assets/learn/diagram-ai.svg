<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Una respuesta de IA requiere revisión humana</title>
  <desc id="desc">Una consulta de alcance definido produce un borrador de IA. Una persona lo contrasta con una fuente aprobada y decide responder o transferir la consulta si falta información o hay dudas.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#155fc5" />
    </marker>
  </defs>
  <rect width="900" height="360" rx="28" fill="#fff8f3" />
  <g fill="#fff" stroke="#ff6b0b" stroke-width="3">
    <rect x="22" y="117" width="178" height="126" rx="18" />
    <rect x="230" y="117" width="176" height="126" rx="18" />
    <rect x="436" y="117" width="190" height="126" rx="18" />
    <rect x="716" y="47" width="162" height="86" rx="16" />
    <rect x="716" y="227" width="162" height="86" rx="16" />
  </g>
  <g fill="none" stroke="#155fc5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 180h20" marker-end="url(#arrow)" />
    <path d="M410 180h20" marker-end="url(#arrow)" />
    <path d="M630 180h38V90h40" marker-end="url(#arrow)" />
    <path d="M668 180v90h40" marker-end="url(#arrow)" />
  </g>
  <g fill="#155fc5" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
    <text x="111" y="171" font-size="31">Consulta</text>
    <text x="318" y="171" font-size="29">Borrador IA</text>
    <text x="531" y="162" font-size="29">Revisión</text>
    <text x="531" y="193" font-size="29">humana</text>
    <text x="797" y="101" font-size="27">Responder</text>
    <text x="797" y="280" font-size="27">Transferir</text>
  </g>
</svg>
